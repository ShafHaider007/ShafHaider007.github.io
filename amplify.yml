version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build          # no `next export`
  artifacts:
    baseDirectory: .next         # SSR expects .next with required-server-files.json
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
