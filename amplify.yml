version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
        - echo '{"version":3,"routes":[{"src":"/","dest":"/index.html"},{"src":"/about","dest":"/about/index.html"},{"src":"/404","dest":"/404.html"}]}' > out/required-server-files.json
        - echo "Build completed successfully"
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
